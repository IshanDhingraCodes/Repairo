services:
  repairo:
    build: .
    container_name: repairo-site
    ports:
      - "8080:80"
    restart: unless-stopped
    # Security: drop all Linux capabilities, read-only root filesystem
    security_opt:
      - no-new-privileges:true
    # Limit resources to prevent abuse
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
